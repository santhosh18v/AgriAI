services:
  ml-service:
    build:
      context: ./ml-service
    container_name: agriai-ml-service
    ports:
      - "8001:8001"
    environment:
      # Mirrors the default resolved path in ml-service/app/config.py --
      # set explicitly so the container path and the bind mount below stay
      # obviously in sync. See ml-service/app/model_loader.py for the
      # checkpoint SHA-256 / confidence-policy / class-map cross-checks
      # this triggers at startup.
      AGRI_ML_MODEL_CHECKPOINT_PATH: /app/data/training-runs/m4-efficientnet-b0-seed42/best_model.pt
      # This container has no MPS/CUDA; "auto" would already resolve to
      # cpu here, but this makes the CPU-only Docker execution explicit.
      AGRI_ML_PREFERRED_DEVICE: cpu
    volumes:
      # Read-only bind mount of the local, gitignored checkpoint -- never
      # baked into the image. Do not modify the checkpoint.
      - ./ml-service/data/training-runs/m4-efficientnet-b0-seed42/best_model.pt:/app/data/training-runs/m4-efficientnet-b0-seed42/best_model.pt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# MongoDB (agriai-mongodb) and Next.js are intentionally not defined here.
# MongoDB already runs as its own standalone container (started via
# `docker start agriai-mongodb`, see docs/CUSTOM_ML_RUNBOOK.md) and is left
# untouched by this file. ml-service has no MongoDB dependency, so it does
# not depend_on it. Next.js remains on the host (`npm run dev`).
